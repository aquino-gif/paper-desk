<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Backup / queue — Miami Bethany</title>
<style>
  :root { --g:#1a9f4b; --g2:#e8f7ee; --ink:#111; --muted:#666; --warn:#c0392b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; color:var(--ink); background:#f7f7f7; }
  .wrap { max-width:560px; margin:0 auto; min-height:100vh; background:#fff; display:flex; flex-direction:column; }
  header { padding:14px 16px 8px; display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  .badge { background:#eef; color:#335; font-weight:700; font-size:12px; padding:6px 10px; border-radius:999px; letter-spacing:.04em; }
  .nav a { font-size:13px; font-weight:700; color:var(--g); text-decoration:none; margin-left:10px; }
  main { flex:1; padding:0 16px 32px; }
  h1 { font-size:22px; margin:8px 0 4px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 12px; line-height:1.4; }
  .stat { border:1px solid #e5e5e5; border-radius:12px; padding:14px; text-align:center; margin:12px 0; }
  .stat b { display:block; font-size:32px; font-variant-numeric:tabular-nums; }
  .stat span { font-size:13px; color:var(--muted); }
  .btn { display:block; width:100%; border:0; border-radius:12px; padding:14px 16px; font-size:15px; font-weight:700; cursor:pointer; }
  .btn.primary { background:var(--g); color:#fff; }
  .btn.secondary { background:#fff; color:var(--g); border:2px solid var(--g); }
  .btn.ghost { background:#eee; color:#333; }
  .btn.danger { background:#fff; color:var(--warn); border:2px solid var(--warn); }
  .btn + .btn { margin-top:8px; }
  .btnrow { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:8px 0; }
  .btnrow .btn { margin-top:0; }
  .hidden { display:none !important; }
  .err { color:var(--warn); font-size:15px; margin:8px 0; font-weight:700; }
  .okmsg { color:var(--g); font-size:15px; margin:8px 0; font-weight:700; }
  .okmsg.big, .err.big {
    display:block; padding:14px 16px; border-radius:12px; margin:12px 0; font-size:17px; line-height:1.35;
  }
  .okmsg.big { background:var(--g2); border:2px solid var(--g); color:#0d5c2e; }
  .err.big { background:#fdecea; border:2px solid var(--warn); color:var(--warn); }
  .gate { padding:40px 16px; }
  input[type=password] {
    width:100%; font-size:18px; padding:14px; border:1px solid #ccc; border-radius:12px; margin:8px 0 12px;
  }
  table { width:100%; border-collapse:collapse; font-size:13px; margin-top:8px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid #eee; vertical-align:top; }
  th { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .empty { text-align:center; color:var(--muted); padding:24px 8px; font-size:14px; }
  .mode { font-size:11px; color:var(--muted); }
  #copyBox { width:100%; min-height:80px; font-size:12px; font-family:ui-monospace,monospace; padding:10px; border:1px solid #ddd; border-radius:10px; margin-top:8px; }
  .danger-zone { margin-top:24px; padding:14px; border:1px dashed #f5c6c6; border-radius:12px; background:#fffafa; }
  .danger-zone h2 { font-size:15px; margin:0 0 8px; color:var(--warn); }
</style>
</head>
<body>
<div class="wrap">
  <div id="gate" class="gate">
    <h1>Backup / queue</h1>
    <p class="sub">Staff only. Offline desk backup for pantry visits.</p>
    <input id="pass" type="password" placeholder="Passcode" autocomplete="current-password">
    <button class="btn primary" id="gateGo">Open</button>
    <p class="err hidden" id="gateErr">Wrong passcode</p>
  </div>

  <div id="app" class="hidden">
    <header>
      <span class="badge">BACKUP</span>
      <div class="nav">
        <a href="app.html?v=20260905j">Returning</a>
      </div>
    </header>
    <main>
      <h1>Desk queue</h1>
      <p class="sub">v20260905j — export, then clear when done. Active list on this phone only.</p>

      <div class="stat"><b id="qCount">0</b><span>Active list</span></div>

      <div class="btnrow">
        <button class="btn primary" id="dlCsv">Download CSV</button>
        <button class="btn secondary" id="dlJson">Download JSON</button>
      </div>
      <button class="btn primary" id="dlJsonl">Download for Intake Queue</button>
      <button class="btn primary" id="exportText">Export to text</button>
      <button class="btn secondary" id="copyCases">Copy case numbers</button>
      <p class="okmsg hidden" id="msg"></p>
      <p class="err hidden" id="err"></p>
      <textarea id="copyBox" class="hidden" readonly></textarea>

      <h2 style="font-size:16px;margin:20px 0 4px">Queue rows</h2>
      <div id="tableWrap"></div>

      <div class="danger-zone">
        <h2>Clear queue</h2>
        <p class="sub">Clears the active list on this phone (what Returning shows).</p>
        <button class="btn danger" id="clear1">Clear queue…</button>
        <button class="btn danger hidden" id="clear2">Really clear queue now</button>
        <button class="btn ghost hidden" id="clearCancel">Cancel</button>
      </div>
    </main>
  </div>
</div>
<script>
const PASS = 'Pedro@2008!';
const QUEUE_KEY = 'mb-pantry-queue';
const BACKUP_KEY = 'mb-pantry-backup';

const $ = (id) => document.getElementById(id);

function load(key) {
  try { return JSON.parse(localStorage.getItem(key) || '[]'); }
  catch (_) { return []; }
}
function save(key, arr) {
  localStorage.setItem(key, JSON.stringify(arr));
}
function fmtTime(iso) {
  if (!iso) return '—';
  try {
    const d = new Date(iso);
    return d.toLocaleString('en-US', { timeZone: 'America/New_York', month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
  } catch (_) { return iso; }
}
function stamp() {
  const d = new Date();
  const p = (x) => String(x).padStart(2,'0');
  return d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
}
function normalizeCaseNum(row) {
  let c = String((row && row.case) || '').trim().toUpperCase();
  if (c && !c.startsWith('C')) {
    const d = c.replace(/\D/g, '');
    if (d) c = 'C' + (d.replace(/^0+/, '') || d);
  }
  if (!c || c === 'C') {
    const bc = String((row && row.barcode) || '').replace(/\D/g, '');
    if (bc) c = 'C' + (bc.replace(/^0+/, '') || bc);
  }
  if (!c || c === 'C') return '';
  const m = c.match(/^C0*(\d+)$/);
  return m ? ('C' + m[1]) : c;
}
function caseParagraphFromRows(rows) {
  const seen = new Set();
  const out = [];
  (rows || []).forEach(r => {
    const c = normalizeCaseNum(r);
    if (!c || seen.has(c)) return;
    seen.add(c);
    out.push(c);
  });
  return out.join(', ');
}
function download(filename, text, mime) {
  const blob = new Blob([text], { type: mime || 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function csvEscape(v) {
  const s = String(v == null ? '' : v);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function toCsv(rows) {
  const cols = ['at','case','name','barcode','staff','matched','mode','source','ver'];
  const lines = [cols.join(',')];
  rows.forEach(r => lines.push(cols.map(c => csvEscape(r[c])).join(',')));
  return lines.join('\n');
}
function flash(ok, text, big) {
  $('msg').classList.add('hidden');
  $('err').classList.add('hidden');
  $('msg').classList.remove('big');
  $('err').classList.remove('big');
  if (ok) {
    $('msg').textContent = text;
    if (big) $('msg').classList.add('big');
    $('msg').classList.remove('hidden');
  } else {
    $('err').textContent = text;
    if (big) $('err').classList.add('big');
    $('err').classList.remove('hidden');
  }
}
function resetClearUI() {
  $('clear1').classList.remove('hidden');
  $('clear2').classList.add('hidden');
  $('clearCancel').classList.add('hidden');
}

function render() {
  const q = load(QUEUE_KEY);
  $('qCount').textContent = q.length;
  const wrap = $('tableWrap');
  if (!q.length) {
    wrap.innerHTML = '<p class="empty">Active list empty.</p>';
    return;
  }
  const rows = q.slice().reverse().map(r => {
    return '<tr>' +
      '<td>' + esc(fmtTime(r.at)) + '</td>' +
      '<td><span class="mode">' + esc(r.mode || '') + '</span></td>' +
      '<td><b>' + esc(r.case || '—') + '</b></td>' +
      '<td>' + esc(r.name || '—') + '</td>' +
      '<td>' + esc(r.phone || '—') + '</td>' +
      '</tr>';
  }).join('');
  wrap.innerHTML = '<table><thead><tr><th>Time</th><th>Mode</th><th>Case</th><th>Name</th><th>Phone</th></tr></thead><tbody>' + rows + '</tbody></table>';
}

$('gateGo').onclick = () => {
  if ($('pass').value !== PASS) {
    $('gateErr').classList.remove('hidden');
    return;
  }
  $('gate').classList.add('hidden');
  $('app').classList.remove('hidden');
  render();
};

$('dlCsv').onclick = () => {
  const q = load(QUEUE_KEY);
  if (!q.length) { flash(false, 'Active list empty.'); return; }
  download('pantry-queue-' + stamp() + '.csv', toCsv(q), 'text/csv');
  flash(true, 'CSV downloaded (' + q.length + ' rows).');
};
$('dlJson').onclick = () => {
  const q = load(QUEUE_KEY);
  if (!q.length) { flash(false, 'Active list empty.'); return; }
  download('pantry-queue-' + stamp() + '.json', JSON.stringify(q, null, 2), 'application/json');
  flash(true, 'JSON downloaded (' + q.length + ' rows).');
};
$('dlJsonl').onclick = () => {
  const q = load(QUEUE_KEY);
  if (!q.length) { flash(false, 'Active list empty.'); return; }
  const st = stamp();
  const jsonl = q.map(r => JSON.stringify(r)).join('\n') + '\n';
  const para = caseParagraphFromRows(q);
  download('returning-captures-' + st + '.jsonl', jsonl, 'application/x-ndjson');
  download('case-numbers-' + st + '.txt', para + '\n', 'text/plain');
  flash(true, 'Downloaded for Intake Queue (' + q.length + ' rows) + case numbers.');
};
$('exportText').onclick = () => {
  const q = load(QUEUE_KEY);
  if (!q.length) { flash(false, 'Active list empty.'); return; }
  const para = caseParagraphFromRows(q);
  const lines = ['Returning captures', 'Cases: ' + para, 'Count: ' + q.length, ''];
  q.forEach((r,i) => lines.push((i+1)+'. '+normalizeCaseNum(r)+' · '+(r.name||'—')+' · '+(r.staff||'')+' · '+(r.at||'')));
  const st = stamp();
  download('returning-export-'+st+'.txt', lines.join('\n')+'\n', 'text/plain');
  download('case-numbers-'+st+'.txt', para+'\n', 'text/plain');
  flash(true, 'Exported text + case numbers.');
};
$('copyCases').onclick = async () => {
  const q = load(QUEUE_KEY);
  const para = caseParagraphFromRows(q);
  if (!para) { flash(false, 'No case numbers in active list'); return; }
  try {
    await navigator.clipboard.writeText(para);
    flash(true, 'Copied: ' + para);
  } catch (_) {
    $('copyBox').value = para;
    $('copyBox').classList.remove('hidden');
    $('copyBox').select();
    flash(true, 'Select/copy the text box below (clipboard blocked).');
  }
};

$('clear1').onclick = () => {
  $('clear1').classList.add('hidden');
  $('clear2').classList.remove('hidden');
  $('clearCancel').classList.remove('hidden');
  flash(false, 'Tap Really clear to empty the active list on this phone.');
};
$('clearCancel').onclick = () => {
  resetClearUI();
  flash(true, 'Clear cancelled.');
};
$('clear2').onclick = () => {
  const q = load(QUEUE_KEY);
  const n = q.length;
  save(QUEUE_KEY, []);
  flash(true, 'Active list empty — ' + n + ' cleared.', true);
  resetClearUI();
  render();
};

function maybeRender() {
  if (!$('app').classList.contains('hidden')) render();
}
window.addEventListener('storage', (e) => {
  if (e.key === QUEUE_KEY || e.key === BACKUP_KEY) maybeRender();
});
window.addEventListener('pageshow', maybeRender);
window.addEventListener('focus', maybeRender);
document.addEventListener('visibilitychange', () => { if (!document.hidden) maybeRender(); });
</script>
</body>
</html>
